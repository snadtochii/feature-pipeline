<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>margin</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="bar">
    <span class="brand">margin</span>
    <span id="scope" class="muted"></span>
    <span class="spacer"></span>
    <span id="save-state" class="muted"></span>
    <button id="cancel" class="ghost" title="End the review without sending the unsent notes">Cancel</button>
    <button id="finish" title="End the review; notes not yet sent stay in the notes file">Finish</button>
    <button id="send" class="primary" title="Send this round's notes to the agent">Send</button>
  </header>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <main class="layout">
    <nav id="tree" class="tree" aria-label="Files in scope">
      <div class="filter-box">
        <input id="filter" type="search" placeholder="Filter files" aria-label="Filter files by path" autocomplete="off" spellcheck="false">
      </div>
      <div id="tree-rows"></div>
    </nav>
    <div class="center">
      <div id="tabs" class="tabs hidden">
        <button id="toggle-files" class="panel-toggle" aria-pressed="true" title="Show or hide the file tree">Files</button>
        <div class="tab-list" role="tablist" aria-label="Center view">
          <button id="tab-overview" class="tab" role="tab" aria-selected="false" aria-controls="overview">Overview</button>
          <button id="tab-code" class="tab on" role="tab" aria-selected="true" aria-controls="code">Code</button>
        </div>
        <span class="spacer"></span>
        <button id="toggle-notes" class="panel-toggle" aria-pressed="true" title="Show or hide the notes">Notes</button>
      </div>
      <div class="panes">
        <section id="overview" class="overview off" role="tabpanel" aria-label="Overview">
          <div id="overview-notice" class="ov-notice"></div>
          <div id="overview-body"></div>
        </section>
        <section id="code" class="code">
          <div class="empty">Pick a file. Click a line number to annotate it; shift-click to extend the range. The <b>+</b> on a tree row annotates that file or folder.</div>
        </section>
      </div>
    </div>
    <aside class="notes">
      <label class="field">
        <span>Overall direction</span>
        <textarea id="overall" rows="4" placeholder="What this whole scope should become, in a few lines. Read by the agent first."></textarea>
      </label>
      <ol id="overall-replies" class="replies" aria-label="The agent's replies to the overall direction"></ol>
      <div class="notes-head">
        <span id="count" class="muted">0 notes</span>
        <button id="add-scope" class="ghost small" title="A note about the scope as a whole">+ general note</button>
      </div>
      <div id="composer" class="composer hidden"></div>
      <ol id="list" class="list"></ol>
    </aside>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
